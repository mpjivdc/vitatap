<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blue Companion">
<meta name="theme-color" content="#0872bd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Blue Companion</title>
<style>
  :root{
    --b1:#0872bd; --b2:#12a5e6; --b-soft:#e9f6fe; --b-ink:#083a5c;
    --ink:#0f172a; --muted:#64748b; --line:#e6eaf0; --card:#fff;
    --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6fb;color:var(--ink);-webkit-font-smoothing:antialiased}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#f7f9fc;position:relative}
  .hidden{display:none!important}
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;gap:14px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .brand .logo{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b1),var(--b2))}
  .brand h1{font-size:22px;letter-spacing:-.5px}
  .brand p{font-size:12px;color:var(--muted)}
  input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--b2);border-color:transparent}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));cursor:pointer}
  .btn:active{opacity:.9}
  .btn.ghost{background:#eef1f6;color:var(--ink)}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;text-align:center}
  .msg.err{background:#fee2e2;color:#b91c1c}.msg.ok{background:#dcfce7;color:#15803d}
  .hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:rgba(247,249,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .top{display:flex;justify-content:space-between;align-items:center}
  header .kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:var(--muted)}
  header h2{font-size:21px;letter-spacing:-.5px;color:var(--b-ink)}
  .role{font-size:11px;font-weight:700;color:var(--b1);background:var(--b-soft);padding:4px 10px;border-radius:999px}
  .link{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
  main{flex:1;overflow-y:auto;padding:14px 16px 96px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 6px 14px -13px rgba(15,23,42,.4)}
  .kpi .n{font-size:22px;font-weight:750;letter-spacing:-.5px}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
  .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:18px 4px 9px;display:flex;justify-content:space-between;align-items:center}
  .sec .add{color:var(--b1);text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer;background:none;border:none;font-weight:700}
  .item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;box-shadow:0 6px 14px -14px rgba(15,23,42,.4);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
  .item.flat{cursor:default}
  .item .title{font-size:14px;font-weight:650}
  .item .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-green{background:#dcfce7;color:#15803d}.p-amber{background:#fef3d6;color:#b26a00}.p-red{background:#fee2e2;color:#b91c1c}
  .p-blue{background:#dbeefe;color:#0b6cb5}.p-grey{background:#eef1f6;color:#475569}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .total{color:#fff;border-radius:16px;padding:15px}
  .total.pay{background:linear-gradient(135deg,#b45309,#f59e0b)}
  .total.paid{background:linear-gradient(135deg,var(--b1),var(--b2))}
  .total .n{font-size:22px;font-weight:750}.total .l{font-size:11px;opacity:.9}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
  .chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f6;color:#475569;white-space:nowrap;border:none;cursor:pointer}
  .chip.active{background:var(--b1);color:#fff}
  .qa{display:flex;gap:10px;margin:14px 0 4px}
  .qa .btn{display:flex;align-items:center;justify-content:center;gap:7px}
  .qa svg{width:17px;height:17px}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9aa5b4;font-weight:600;background:none;border:none;cursor:pointer;padding:4px 8px}
  .tab.active{color:var(--b1)}
  .tab svg{width:23px;height:23px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}
  .spin{width:26px;height:26px;border:3px solid var(--b-soft);border-top-color:var(--b1);border-radius:50%;animation:s .8s linear infinite;margin:40px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto;animation:up .18s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{font-size:17px;margin-bottom:12px;letter-spacing:-.3px}
  .field{margin-bottom:10px}
  .field label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
  .row-btns{display:flex;gap:10px;margin-top:14px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}
  #reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:220px}
</style>
</head>
<body>
<div id="app">
  <div id="login" class="login">
    <div class="brand">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7Z"/></svg></div>
      <div><h1>Blue Companion</h1><p>Field operations · VitaTap</p></div>
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" value="maarten@vandecruys.world">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Sign in</button>
    <div id="loginMsg" class="msg hidden"></div>
    <p class="hint" id="diag">Starting…</p>
  </div>

  <div id="main-app" class="hidden" style="flex:1;display:flex;flex-direction:column">
    <header>
      <div class="top">
        <div><div class="kicker">Field operations</div><h2 id="viewTitle">Home</h2></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="role" id="roleTag">…</span>
          <button class="link" id="logoutBtn">Sign out</button>
        </div>
      </div>
    </header>
    <main id="content"><div class="spin"></div></main>
    <nav id="nav">
      <button class="tab active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
      <button class="tab" data-view="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Leads</button>
      <button class="tab" data-view="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/></svg>Stock</button>
      <button class="tab" data-view="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>Clients</button>
      <button class="tab" data-view="comm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Comm.</button>
    </nav>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const SUPABASE_URL = "https://hblhalopooblmzrdwokt.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibGhhbG9wb29ibG16cmR3b2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDA1MDAsImV4cCI6MjA5ODkxNjUwMH0.Io_jHOyx0fuHCmQ_1W7lMrWrkIMrcUoTz06XJL7YARo";
  let sb=null;

  const $=s=>document.querySelector(s);
  const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
  const eur=n=>"€"+Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:0,maximumFractionDigits:0});
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dfmt=d=>d?new Date(d).toLocaleDateString('nl-BE'):'—';

  // ---- CDN-independent loader (own origin first, then public CDNs) ----
  const SB_CDNS=[
    "./vendor/supabase.js",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ];
  function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=()=>res(1);s.onerror=()=>rej(0);document.head.appendChild(s);});}
  async function ensureSupabase(){
    if(window.supabase&&window.supabase.createClient) return true;
    for(const u of SB_CDNS){ try{await loadScript(u);}catch(e){continue;} if(window.supabase&&window.supabase.createClient) return true; }
    return !!(window.supabase&&window.supabase.createClient);
  }
  function initSb(){ if(sb) return true; if(!window.supabase||!window.supabase.createClient) return false; sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON); return true; }
  function setDiag(t,bad){const d=$('#diag');if(d){d.textContent=t;d.style.color=bad?'#b91c1c':'var(--muted)';}}

  // ---- App state ----
  const S={ me:null, role:'installer', products:[], plans:[], clients:[], units:[], leads:[], commissions:[], staff:[] };
  const byId=(arr,id)=>arr.find(x=>x.id===id);
  const staffName=id=>{const s=byId(S.staff,id);return s?(s.full_name||s.email):'—';};
  const clientName=id=>{const c=byId(S.clients,id);return c?c.full_name:'—';};
  const productName=id=>{const p=byId(S.products,id);return p?p.name:'—';};
  const planName=id=>{const p=byId(S.plans,id);return p?p.name:'—';};

  async function loadAll(){
    const q=[
      sb.from('products').select('*').order('name'),
      sb.from('plans').select('*').order('monthly_price'),
      sb.from('clients').select('*').order('full_name'),
      sb.from('serialized_units').select('*').order('serial'),
      sb.from('leads').select('*').order('created_at',{ascending:false}),
      sb.from('commissions').select('*').order('created_at',{ascending:false}),
      sb.from('profiles').select('id,email,full_name,role')
    ];
    const [pr,pl,cl,un,le,co,st]=await Promise.all(q);
    S.products=pr.data||[]; S.plans=pl.data||[]; S.clients=cl.data||[];
    S.units=un.data||[]; S.leads=le.data||[]; S.commissions=co.data||[]; S.staff=st.data||[];
  }

  // ---- Auth ----
  async function refresh(){
    setDiag('Loading login library…'); await ensureSupabase();
    if(!initSb()){ setDiag('Library blocked here — open index.html in Safari/Chrome (not a preview), or use the hosted URL.',true); showLogin(); return; }
    setDiag('Ready — you can sign in.');
    try{ const {data:{session}}=await sb.auth.getSession(); session?showApp():showLogin(); }catch(e){ showLogin(); }
  }
  function showLogin(){ $('#login').classList.remove('hidden'); $('#main-app').classList.add('hidden'); }
  async function showApp(){
    $('#login').classList.add('hidden'); $('#main-app').classList.remove('hidden');
    const {data:prof}=await sb.from('profiles').select('id,email,full_name,role').maybeSingle();
    S.me=prof||null; S.role=prof?prof.role:'installer'; $('#roleTag').textContent=S.role;
    // admin-only tabs
    $('#nav').querySelector('[data-view="clients"]').style.display = S.role==='admin'?'':'none';
    render('home');
  }
  async function doLogin(){
    const m=$('#loginMsg'); m.classList.remove('hidden'); m.className='msg'; m.textContent='Loading…';
    await ensureSupabase();
    if(!initSb()){ m.className='msg err'; m.textContent='Login library not loaded — open in a real browser or the hosted URL.'; return; }
    const email=$('#email').value.trim(), password=$('#password').value;
    if(!password){ m.className='msg err'; m.textContent='Enter your password.'; return; }
    m.textContent='Signing in…';
    try{ const {error}=await sb.auth.signInWithPassword({email,password});
      if(error){ m.className='msg err'; m.textContent=(error.status?('['+error.status+'] '):'')+error.message; return; }
      m.classList.add('hidden'); showApp();
    }catch(e){ m.className='msg err'; m.textContent='Network error: '+(e&&e.message?e.message:e); }
  }

  // ---- Navigation ----
  const titles={home:'Home',leads:'Leads',stock:'Stock',clients:'Clients',comm:'Commissions'};
  let scanner=null;
  document.addEventListener('click',e=>{
    const tab=e.target.closest('.tab'); if(tab){ render(tab.dataset.view); return; }
  });
  $('#loginBtn').onclick=doLogin;
  $('#password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  $('#logoutBtn').onclick=async()=>{ if(scanner){try{await scanner.stop()}catch(e){}} await sb.auth.signOut(); location.reload(); };

  async function render(view){
    [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('active',t.dataset.view===view));
    $('#viewTitle').textContent=titles[view]||'Home';
    const c=$('#content'); c.innerHTML='<div class="spin"></div>';
    if(scanner){try{await scanner.stop()}catch(e){} scanner=null;}
    try{ await loadAll();
      if(view==='home') return renderHome(c);
      if(view==='leads') return renderLeads(c);
      if(view==='stock') return renderStock(c);
      if(view==='clients') return renderClients(c);
      if(view==='comm') return renderComm(c);
    }catch(e){ c.innerHTML='<div class="empty">Could not load: '+esc(e.message)+'</div>'; }
  }
  async function reload(view){ await loadAll(); const v=view||[...document.querySelectorAll('.tab.active')][0].dataset.view; render(v); }

  // ---- HOME ----
  function renderHome(c){
    const stock=S.products.reduce((s,p)=>s+(p.stock_on_hand||0),0);
    const installed=S.units.filter(u=>u.status==='installed').length;
    const openLeads=S.leads.filter(l=>!['won','lost'].includes(l.status)).length;
    const toPay=S.commissions.filter(x=>!x.paid).reduce((s,x)=>s+Number(x.amount||0),0);
    const low=S.products.filter(p=>p.stock_on_hand<=p.reorder_point);
    c.innerHTML='';
    c.appendChild(el(`<div style="font-size:14px;color:var(--muted);margin:2px 2px 12px">Welcome back${S.me&&S.me.email?', '+esc(S.me.email.split('@')[0]):''} · <b style="color:var(--b1)">${S.role}</b></div>`));
    const grid=el('<div class="kpis"></div>');
    [['Units in stock',stock],['Installed units',installed],['To pay',eur(toPay)],['Open leads',openLeads]]
      .forEach(([l,n])=>grid.appendChild(el(`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`)));
    c.appendChild(grid);
    const qa=el('<div class="qa"></div>');
    qa.appendChild(el(`<button class="btn" data-act="scan"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 8v8M11 8v8M15 8v8"/></svg>Scan unit</button>`));
    qa.appendChild(el(`<button class="btn ghost" data-act="addLead">＋ Add lead</button>`));
    c.appendChild(qa);
    c.appendChild(el(`<div class="sec">Inventory alerts</div>`));
    if(!low.length) c.appendChild(el('<div class="empty">All products above reorder point.</div>'));
    low.forEach(p=>c.appendChild(el(`<div class="item flat"><div><div class="title">${esc(p.name)}</div><div class="sub">${p.stock_on_hand} left · reorder ${p.reorder_point}</div></div><span class="pill p-red">Low stock</span></div>`)));
  }

  // ---- LEADS ----
  const LEAD_ST={new:'p-blue',contacted:'p-amber',quoted:'p-amber',won:'p-green',lost:'p-red'};
  function renderLeads(c){
    c.innerHTML='';
    c.appendChild(el(`<div class="sec">Leads<button class="add" data-act="addLead">＋ Add</button></div>`));
    if(!S.leads.length) c.appendChild(el('<div class="empty">No leads yet. Tap ＋ Add.</div>'));
    S.leads.forEach(l=>{
      const it=el(`<div class="item" data-act="lead" data-id="${l.id}"><div><div class="title">${esc(l.full_name)}</div><div class="sub">${esc(l.city||'')} · ${esc(l.source||'')}</div></div><span class="pill ${LEAD_ST[l.status]||'p-grey'}">${l.status}</span></div>`);
      c.appendChild(it);
    });
  }
  function leadForm(lead){
    const st=['new','contacted','quoted','won','lost'];
    const isAdmin=S.role==='admin';
    const owners=S.staff.map(s=>`<option value="${s.id}" ${lead&&lead.owner_installer===s.id?'selected':''}>${esc(s.full_name||s.email)}</option>`).join('');
    return `
      <div class="field"><label>Name</label><input id="f_name" value="${esc(lead?lead.full_name:'')}"></div>
      <div class="field"><label>City</label><input id="f_city" value="${esc(lead?lead.city:'')}"></div>
      <div class="field"><label>Source</label><input id="f_source" value="${esc(lead?lead.source:'')}"></div>
      <div class="field"><label>Status</label><select id="f_status">${st.map(s=>`<option ${lead&&lead.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      ${isAdmin?`<div class="field"><label>Owner (installer)</label><select id="f_owner"><option value="">— unassigned —</option>${owners}</select></div>`:''}`;
  }
  function openAddLead(){
    openModal('New lead', leadForm(null), async()=>{
      const rec={ full_name:$('#f_name').value.trim(), city:$('#f_city').value.trim(), source:$('#f_source').value.trim(), status:$('#f_status').value };
      if(!rec.full_name){ alert('Name required'); return false; }
      rec.owner_installer = S.role==='admin' ? ($('#f_owner').value||null) : S.me.id;
      const {error}=await sb.from('leads').insert(rec);
      if(error){ alert(error.message); return false; }
      await reload('leads'); return true;
    });
  }
  function openLead(id){
    const l=byId(S.leads,id); if(!l) return;
    openModal('Edit lead', leadForm(l), async()=>{
      const rec={ full_name:$('#f_name').value.trim(), city:$('#f_city').value.trim(), source:$('#f_source').value.trim(), status:$('#f_status').value };
      if(S.role==='admin') rec.owner_installer=$('#f_owner').value||null;
      const {error}=await sb.from('leads').update(rec).eq('id',id);
      if(error){ alert(error.message); return false; }
      await reload('leads'); return true;
    });
  }

  // ---- STOCK ----
  let unitFilter='all';
  const UNIT_ST={in_stock:'p-grey',installed:'p-green',swap:'p-amber',returned:'p-red'};
  function renderStock(c){
    c.innerHTML='';
    c.appendChild(el('<div class="sec">Products</div>'));
    S.products.forEach(p=>{
      const pill=p.stock_on_hand<=p.reorder_point?'p-red':'p-green';
      c.appendChild(el(`<div class="item flat"><div><div class="title">${esc(p.name)}</div><div class="sub">${esc(p.sku||'')} · ${eur(p.unit_price)}</div></div><span class="pill ${pill}">${p.stock_on_hand} in stock</span></div>`));
    });
    c.appendChild(el('<div class="sec">Serialised units</div>'));
    const chips=el('<div class="chips"></div>');
    [['all','All'],['in_stock','In stock'],['installed','Installed'],['swap','Swap'],['returned','Returned']].forEach(([v,lbl])=>{
      const ch=el(`<button class="chip ${unitFilter===v?'active':''}">${lbl}</button>`);
      ch.onclick=()=>{unitFilter=v; renderStock(c);}; chips.appendChild(ch);
    });
    c.appendChild(chips);
    const list=S.units.filter(u=>unitFilter==='all'||u.status===unitFilter);
    if(!list.length) c.appendChild(el('<div class="empty">No units in this view.</div>'));
    list.forEach(u=>c.appendChild(el(`<div class="item" data-act="unit" data-id="${u.id}"><div><div class="title">${esc(u.serial)}</div><div class="sub">${esc(productName(u.product_id))}${u.client_id?' · '+esc(clientName(u.client_id)):''}</div></div><span class="pill ${UNIT_ST[u.status]||'p-grey'}">${(u.status||'').replace('_',' ')}</span></div>`)));
  }
  function openUnit(id){
    const u=byId(S.units,id); if(!u) return;
    const body=`
      <div class="kv"><span class="k">Serial</span><span>${esc(u.serial)}</span></div>
      <div class="kv"><span class="k">Product</span><span>${esc(productName(u.product_id))}</span></div>
      <div class="kv"><span class="k">Status</span><span>${(u.status||'').replace('_',' ')}</span></div>
      <div class="kv"><span class="k">Client</span><span>${u.client_id?esc(clientName(u.client_id)):'—'}</span></div>
      <div class="kv"><span class="k">Installer</span><span>${u.assigned_installer?esc(staffName(u.assigned_installer)):'—'}</span></div>
      <div class="kv"><span class="k">Installed on</span><span>${dfmt(u.installed_at)}</span></div>
      <div class="sec" style="margin:16px 2px 8px">Actions</div>
      <div id="unitActions"></div>`;
    openModal('Unit '+esc(u.serial), body, null);
    const wrap=$('#unitActions');
    const clientOpts=S.clients.map(cl=>`<option value="${cl.id}">${esc(cl.full_name)}</option>`).join('');
    wrap.innerHTML=`
      <div class="field"><label>Client (for install)</label><select id="u_client"><option value="">—</option>${clientOpts}</select></div>
      <div class="field"><label>Install date</label><input id="u_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="row-btns"><button class="btn sm" id="u_install">Mark installed</button><button class="btn sm ghost" id="u_swap">Swap</button><button class="btn sm ghost" id="u_return">Return</button><button class="btn sm ghost" id="u_stock">In stock</button></div>`;
    const setStatus=async(status,extra)=>{ const {error}=await sb.from('serialized_units').update(Object.assign({status},extra||{})).eq('id',id); if(error){alert(error.message);return;} closeModal(); await reload('stock'); };
    $('#u_install').onclick=()=>{ const cid=$('#u_client').value||null; setStatus('installed',{client_id:cid,installed_at:$('#u_date').value}); };
    $('#u_swap').onclick=()=>setStatus('swap',{});
    $('#u_return').onclick=()=>setStatus('returned',{});
    $('#u_stock').onclick=()=>setStatus('in_stock',{client_id:null,installed_at:null});
  }

  // ---- CLIENTS ----
  function renderClients(c){
    c.innerHTML='';
    c.appendChild(el(`<div class="sec">Clients<button class="add" data-act="addClient">＋ Add</button></div>`));
    if(!S.clients.length) c.appendChild(el('<div class="empty">No clients yet.</div>'));
    S.clients.forEach(cl=>c.appendChild(el(`<div class="item" data-act="client" data-id="${cl.id}"><div><div class="title">${esc(cl.full_name)}</div><div class="sub">${esc(cl.city||'')}${cl.plan_id?' · '+esc(planName(cl.plan_id)):''}</div></div><span class="pill p-blue">${S.units.filter(u=>u.client_id===cl.id).length} unit(s)</span></div>`)));
  }
  function clientForm(cl){
    const plans=S.plans.map(p=>`<option value="${p.id}" ${cl&&cl.plan_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
    return `
      <div class="field"><label>Name</label><input id="c_name" value="${esc(cl?cl.full_name:'')}"></div>
      <div class="field"><label>City</label><input id="c_city" value="${esc(cl?cl.city:'')}"></div>
      <div class="field"><label>Email</label><input id="c_email" value="${esc(cl?cl.email:'')}"></div>
      <div class="field"><label>Phone</label><input id="c_phone" value="${esc(cl?cl.phone:'')}"></div>
      <div class="field"><label>Plan</label><select id="c_plan"><option value="">—</option>${plans}</select></div>`;
  }
  function openAddClient(){
    openModal('New client', clientForm(null), async()=>{
      const rec={ full_name:$('#c_name').value.trim(), city:$('#c_city').value.trim(), email:$('#c_email').value.trim(), phone:$('#c_phone').value.trim(), plan_id:$('#c_plan').value||null };
      if(!rec.full_name){ alert('Name required'); return false; }
      const {error}=await sb.from('clients').insert(rec);
      if(error){ alert(error.message); return false; }
      await reload('clients'); return true;
    });
  }
  function openClient(id){
    const cl=byId(S.clients,id); if(!cl) return;
    const units=S.units.filter(u=>u.client_id===id);
    const extra=`
      <div class="sec" style="margin:16px 2px 8px">Units</div>
      ${units.length?units.map(u=>`<div class="item flat"><div><div class="title">${esc(u.serial)}</div><div class="sub">${esc(productName(u.product_id))}</div></div><span class="pill ${UNIT_ST[u.status]||'p-grey'}">${(u.status||'').replace('_',' ')}</span></div>`).join(''):'<div class="empty">No units.</div>'}`;
    openModal('Edit client', clientForm(cl)+extra, async()=>{
      const rec={ full_name:$('#c_name').value.trim(), city:$('#c_city').value.trim(), email:$('#c_email').value.trim(), phone:$('#c_phone').value.trim(), plan_id:$('#c_plan').value||null };
      const {error}=await sb.from('clients').update(rec).eq('id',id);
      if(error){ alert(error.message); return false; }
      await reload('clients'); return true;
    });
  }

  // ---- COMMISSIONS ----
  const COMM_LBL={company_lead_install:'Company-lead install',own_lead_sale_install:'Own-lead sale + install'};
  function renderComm(c){
    c.innerHTML='';
    const toPay=S.commissions.filter(x=>!x.paid).reduce((s,x)=>s+Number(x.amount||0),0);
    const paid=S.commissions.filter(x=>x.paid).reduce((s,x)=>s+Number(x.amount||0),0);
    const tot=el('<div class="row2"></div>');
    tot.appendChild(el(`<div class="total pay"><div class="n">${eur(toPay)}</div><div class="l">To pay</div></div>`));
    tot.appendChild(el(`<div class="total paid"><div class="n">${eur(paid)}</div><div class="l">Paid</div></div>`));
    c.appendChild(tot);
    c.appendChild(el('<div class="sec">Commissions</div>'));
    const isAdmin=S.role==='admin';
    if(!S.commissions.length) c.appendChild(el('<div class="empty">No commissions.</div>'));
    S.commissions.forEach(x=>{
      const who=isAdmin?(' · '+esc(staffName(x.staff_id))):'';
      const it=el(`<div class="item ${isAdmin?'':'flat'}" ${isAdmin?`data-act="paid" data-id="${x.id}"`:''}><div><div class="title">${COMM_LBL[x.type]||esc(x.type)} · ${eur(x.amount)}</div><div class="sub">${dfmt(x.created_at)}${who}${x.paid&&x.paid_at?' · paid '+dfmt(x.paid_at):''}</div></div><span class="pill ${x.paid?'p-green':'p-amber'}">${x.paid?'paid':'to pay'}</span></div>`);
      c.appendChild(it);
    });
    if(isAdmin) c.appendChild(el('<div class="hint" style="margin-top:8px">Tap a commission to toggle paid / to-pay.</div>'));
  }
  async function togglePaid(id){
    const x=byId(S.commissions,id); if(!x) return;
    const np=!x.paid;
    const {error}=await sb.from('commissions').update({paid:np, paid_at: np?new Date().toISOString().slice(0,10):null}).eq('id',id);
    if(error){ alert(error.message); return; }
    await reload('comm');
  }

  // ---- SCAN (overlay) ----
  async function openScan(){
    const body=`<div id="reader"></div><p class="hint" style="margin-top:10px">Point the camera at a unit barcode.</p><div id="scanResult"></div>`;
    openModal('Scan a unit', body, null);
    try{
      scanner=new Html5Qrcode("reader");
      await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:150}},async(text)=>{
        try{await scanner.stop()}catch(e){} scanner=null;
        const u=S.units.find(x=>x.serial===text);
        const r=$('#scanResult');
        if(u){ r.innerHTML=`<div class="item flat"><div><div class="title">${esc(u.serial)}</div><div class="sub">${esc(productName(u.product_id))}</div></div><span class="pill ${UNIT_ST[u.status]||'p-grey'}">${(u.status||'').replace('_',' ')}</span></div>`;
          const open=el('<button class="btn" style="margin-top:10px">Open unit</button>'); open.onclick=()=>{closeModal();openUnit(u.id);}; r.appendChild(open);
        } else { r.innerHTML=`<div class="item flat"><div><div class="title">${esc(text)}</div><div class="sub">No matching unit</div></div><span class="pill p-grey">unknown</span></div>`; }
      });
    }catch(e){ $('#reader').innerHTML='<div class="empty" style="color:#fff;padding:40px">Camera unavailable — needs HTTPS (hosted URL) and permission.</div>'; }
  }

  // ---- Modal system ----
  function openModal(title, bodyHTML, onSave){
    closeModal();
    const bg=el('<div class="modal-bg" id="modal"></div>');
    const sheet=el(`<div class="sheet"></div>`);
    sheet.appendChild(el(`<h3>${esc(title)}</h3>`));
    const body=el('<div></div>'); body.innerHTML=bodyHTML; sheet.appendChild(body);
    const btns=el('<div class="row-btns"></div>');
    if(onSave){ const save=el('<button class="btn">Save</button>'); save.onclick=async()=>{ save.disabled=true; const ok=await onSave(); save.disabled=false; if(ok!==false) closeModal(); }; btns.appendChild(save); }
    const close=el(`<button class="btn ghost">${onSave?'Cancel':'Close'}</button>`); close.onclick=async()=>{ if(scanner){try{await scanner.stop()}catch(e){}scanner=null;} closeModal(); };
    btns.appendChild(close); sheet.appendChild(btns);
    bg.appendChild(sheet); bg.addEventListener('click',e=>{ if(e.target===bg){ close.click(); } });
    document.body.appendChild(bg);
  }
  function closeModal(){ const m=$('#modal'); if(m) m.remove(); }

  // ---- Action delegation ----
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]'); if(!a) return;
    const id=a.dataset.id;
    switch(a.dataset.act){
      case 'addLead': openAddLead(); break;
      case 'lead': openLead(id); break;
      case 'unit': openUnit(id); break;
      case 'addClient': openAddClient(); break;
      case 'client': openClient(id); break;
      case 'paid': togglePaid(id); break;
      case 'scan': openScan(); break;
    }
  });

  refresh();
</script>
</body>
</html>
